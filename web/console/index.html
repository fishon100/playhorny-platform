<style>
/* ===== 設計系統 =====
   版面概念：製作進度控制台——冷調中性灰的工作面，單一深青色標示「目前這一步」與可操作的東西；
   中文用 Noto Sans TC、英數用 IBM Plex Sans、指令與代號用 IBM Plex Mono（這一行的行話）。 */
:root {
  --bg: #f3f5f6; --panel: #ffffff; --side: #eef1f3; --canvas: #f6f8f9;
  --ink: #131c22; --sub: #46545e; --faint: #76838c; --line: #dfe4e7; --line-strong: #c8d0d5;
  --hover: #e8ecef; --sel: #e0eff2;
  --accent: #0b6e83; --accent-ink: #ffffff; --accent-soft: #e2f1f4; --accent-line: #a3d2dc;
  --ok: #15803d; --ok-soft: #e5f4ea; --warn: #b45309; --warn-soft: #fbf0e1; --bad: #b91c1c; --bad-soft: #fbe9e9; --info: #1d4ed8; --info-soft: #e7eefc; --violet: #6d28d9; --violet-soft: #efe9fb;
  --dot: #d8dee2;
  --font: "IBM Plex Sans", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, "Noto Sans TC", monospace;
  --r: 6px; --r-lg: 8px;
  --shadow: none; --shadow-lg: 0 12px 36px rgb(10 24 32 / .16);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1114; --panel: #131a1e; --side: #0f1518; --canvas: #10171b;
  --ink: #e6edf0; --sub: #a5b2ba; --faint: #6e7c85; --line: #212b31; --line-strong: #2e3a41;
  --hover: #1a2328; --sel: #11313a;
  --accent: #4db6ca; --accent-ink: #061115; --accent-soft: #11313a; --accent-line: #1f5967;
  --ok: #4ade80; --ok-soft: #12291b; --warn: #f2b25c; --warn-soft: #2d2212; --bad: #f87171; --bad-soft: #2e1717; --info: #7aa7ff; --info-soft: #14223b; --violet: #b49cf7; --violet-soft: #231c38;
  --dot: #1f282e; --shadow-lg: 0 12px 36px rgb(0 0 0 / .5); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0c1114; --panel: #131a1e; --side: #0f1518; --canvas: #10171b;
  --ink: #e6edf0; --sub: #a5b2ba; --faint: #6e7c85; --line: #212b31; --line-strong: #2e3a41;
  --hover: #1a2328; --sel: #11313a;
  --accent: #4db6ca; --accent-ink: #061115; --accent-soft: #11313a; --accent-line: #1f5967;
  --ok: #4ade80; --ok-soft: #12291b; --warn: #f2b25c; --warn-soft: #2d2212; --bad: #f87171; --bad-soft: #2e1717; --info: #7aa7ff; --info-soft: #14223b; --violet: #b49cf7; --violet-soft: #231c38;
  --dot: #1f282e; --shadow-lg: 0 12px 36px rgb(0 0 0 / .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; font-feature-settings: "palt" 0; }
h1, h2, h3 { text-wrap: balance; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
.ico { flex: none; vertical-align: middle; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ===== 版面 ===== */
.app { display: grid; grid-template-columns: 236px 1fr; grid-template-rows: 52px 1fr; height: 100vh; height: 100dvh; }
.top { grid-column: 1 / -1; position: relative; z-index: 40; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; white-space: nowrap; padding-right: 6px; }
.brand img { width: 24px; height: 24px; }
.proj { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); cursor: pointer; min-width: 0; max-width: 380px; font-weight: 600; font-size: 13px; }
.proj:hover { border-color: var(--line-strong); }
.proj .pdot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.proj b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.proj .repo { color: var(--faint); font-weight: 400; font-family: var(--mono); font-size: 11.5px; white-space: nowrap; padding-left: 8px; border-left: 1px solid var(--line); }
.spacer { flex: 1; }
.fresh { color: var(--faint); font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid transparent; border-radius: 8px; background: none; cursor: pointer; color: var(--sub); white-space: nowrap; text-decoration: none; }
.ibtn:hover { background: var(--hover); color: var(--ink); text-decoration: none; }
.ibtn.outline { border-color: var(--line); color: var(--ink); background: var(--panel); border-radius: var(--r); }
.menu-btn { display: none; }
.who { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; color: var(--ink); } .who img { width: 22px; height: 22px; border-radius: 50%; }

/* ===== 側欄 ===== */
.side { background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 10px 24px; }
.side h6 { margin: 18px 10px 6px; font-size: 11px; letter-spacing: .08em; color: var(--faint); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.nav { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: var(--r); background: none; cursor: pointer; text-align: left; color: var(--sub); font-weight: 500; font-size: 13.5px; text-decoration: none; }
.nav:hover { background: var(--hover); color: var(--ink); text-decoration: none; }
.nav[aria-current="page"] { background: var(--sel); color: var(--accent); font-weight: 600; }
.nav[aria-current="page"] .ico { color: var(--accent); }
.nav .n { margin-left: auto; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav .n.hot { color: var(--bad); background: var(--bad-soft); border-radius: 4px; padding: 0 6px; line-height: 18px; font-weight: 600; }
.nav .ext { margin-left: auto; color: var(--faint); }

/* ===== 主區、明細 ===== */
.main { overflow: hidden; display: flex; min-width: 0; }
.view { flex: 1; overflow-y: auto; padding: 22px 28px 48px; min-width: 0; }
.detail { width: min(46%, 600px); border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 20px 24px 48px; display: none; }
.detail.open { display: block; }
.vh { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.vh h1 { font-size: 21px; font-weight: 600; margin: 0; letter-spacing: -.005em; display: flex; align-items: center; gap: 10px; }
.vh h1 .ico { color: var(--faint); }
.vh .sub { color: var(--faint); font-size: 13px; }
.crumb { color: var(--faint); font-size: 12px; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; font-family: var(--mono); }
h3 { font-size: 12.5px; font-weight: 600; margin: 0 0 10px; color: var(--sub); display: flex; align-items: center; gap: 7px; letter-spacing: .02em; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
/* 以標題開頭的卡片＝面板：標題列有分隔線（所有頁面一致） */
.card > h3:first-child { margin: -14px -16px 8px; padding: 11px 16px; border-bottom: 1px solid var(--line); color: var(--ink); font-size: 13px; letter-spacing: 0; }
.card > h3:first-child .ico { color: var(--faint); }
.panel > .ph .ico { color: var(--faint); }
.panel > .ph { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.panel > .ph h3 { margin: 0; color: var(--ink); font-size: 13px; letter-spacing: 0; }
.panel > .ph .spacer { flex: 1; }
.panel > .pb { padding: 6px 16px 10px; }
.panel > .pb.flush { padding: 0; }
.panel > .pb.flush .t th:first-child, .panel > .pb.flush .t td:first-child { padding-left: 16px; }
.ov-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; align-items: start; }
.ov-grid > .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 1000px) { .ov-grid { grid-template-columns: minmax(0, 1fr); } }
.list li > .ico { color: var(--faint); }
.card + .card { margin-top: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 14px; margin-top: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.strip .seg-i { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-left: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-top: 0; border-right: 0; border-bottom: 0; font: inherit; color: inherit; }
.strip .seg-i:first-child { border-left: 0; }
.strip .seg-i:hover { background: var(--hover); }
.strip .k { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); font-weight: 500; }
.strip b { font-size: 22px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.strip .seg-i.attn b { color: var(--warn); }
.strip .seg-i.bad b { color: var(--bad); }
@media (max-width: 900px) { .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); } .strip .seg-i:nth-child(4) { border-left: 0; } .strip .seg-i:nth-child(n+4) { border-top: 1px solid var(--line); } }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; cursor: default; }
.kpi[data-go] { cursor: pointer; } .kpi[data-go]:hover { border-color: var(--line-strong); }
.kpi .k { display: flex; align-items: center; gap: 7px; color: var(--faint); font-size: 12.5px; font-weight: 500; }
.kpi b { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.muted { color: var(--faint); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--hover); color: var(--sub); border: 0; }
button.chip { cursor: pointer; } button.chip:hover { filter: brightness(.97); }
.c-tech { background: var(--violet-soft); color: var(--violet); }
.s-待同意 { background: var(--warn-soft); color: var(--warn); }
.s-已同意 { background: var(--info-soft); color: var(--info); }
.s-製作中 { background: var(--accent-soft); color: var(--accent); }
.s-需求, .s-企劃書, .s-示意圖 { background: var(--line-strong); }
.s-需求確認, .s-驗收 { background: var(--warn-soft); color: var(--warn); }
.s-並行製作 { background: var(--accent-soft); color: var(--accent); }
.s-待歸檔 { background: var(--ok-soft); color: var(--ok); }
.s-待驗收 { background: var(--violet-soft); color: var(--violet); }
.s-已完成 { background: var(--ok-soft); color: var(--ok); }
.c-bad { background: var(--bad-soft); color: var(--bad); } .c-ok { background: var(--ok-soft); color: var(--ok); } .c-warn { background: var(--warn-soft); color: var(--warn); } .c-info { background: var(--info-soft); color: var(--info); }
/* 提案的文件組合 */
.docs-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: -4px 0 14px; }
/* 示意圖檢視器 */
.mock-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.mock-stage { display: flex; justify-content: center; background: var(--canvas); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; }
.mock-stage iframe.mock { width: 390px; max-width: 100%; height: 76vh; border: 1px solid var(--line-strong); border-radius: 18px; background: #fff; }
.mock-stage.full iframe.mock { width: 100%; border-radius: var(--r); }
/* 試玩清單 */
.qa { border: 1px solid var(--line); border-radius: var(--r); margin: 4px 0 18px; overflow: hidden; }
.qa.all { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.qa-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; background: var(--canvas); border-bottom: 1px solid var(--line); }
.qa-h .ico { color: var(--accent); }
.qa-list { list-style: none; margin: 0; padding: 0; }
.qa-list li { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.qa-list li:last-child { border-bottom: 0; }
.qa-list li .g { flex: 1; min-width: 0; line-height: 1.5; }
.qa-list li.ok .g > div:first-child { color: var(--sub); }
.qa-list li.bad { background: color-mix(in srgb, var(--bad-soft) 60%, transparent); }
.qa-ck { border: 0; background: none; padding: 2px; cursor: pointer; color: var(--faint); border-radius: 50%; }
.qa-ck[aria-pressed="true"] { color: var(--ok); }
.qa-ck:hover { color: var(--accent); }
.qa > p { margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); }
.bad-t { color: var(--bad); font-weight: 600; } .ok-t { color: var(--ok); font-weight: 600; display: flex; align-items: center; gap: 6px; }
/* 素材確認 */
.flowline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 0 0 10px; }
.flowline span:not(.sep) { font-weight: 600; color: var(--ink); }
.flowline .sep { color: var(--line-strong); }
table.assets td.sent { min-width: 140px; }
table.assets td.acts { white-space: nowrap; }
table.assets td.acts .btn + .btn { margin-left: 4px; }
.thumb { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 0; width: 44px; height: 44px; overflow: hidden; cursor: zoom-in; margin: 0 4px 4px 0; }
.thumb img, .thumbs img { width: 100%; height: 100%; object-fit: contain; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 12px; }
.thumbs img { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.note { font-size: 12.5px; color: var(--sub); display: flex; gap: 4px; align-items: flex-start; }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; min-width: 70px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .btn.primary:hover { filter: brightness(1.06); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .6; cursor: progress; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); padding: 2px; background: var(--side); }
.seg button { border: 0; background: none; height: 26px; padding: 0 11px; border-radius: 4px; cursor: pointer; color: var(--sub); font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.search { width: 100%; max-width: 300px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); color: var(--ink); font: inherit; }

/* 表格 */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); }
table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: left; font-size: 11.5px; color: var(--faint); font-weight: 600; padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--canvas); letter-spacing: .04em; }
.t td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
.t tr:last-child td { border-bottom: 0; }
.t th, .t td { min-width: 4.5em; }
.t tr.click { cursor: pointer; } .t tr.click:hover td { background: var(--hover); } .t tr.sel td { background: var(--sel); }

/* 清單 */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.list li:first-child { border-top: 0; }
.list .g { flex: 1; min-width: 0; }
.list .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--warn); }
.status-dot.ok { background: var(--ok); } .status-dot.bad { background: var(--bad); } .status-dot.info { background: var(--accent); }
.empty { color: var(--faint); padding: 18px 0; text-align: center; font-size: 13px; }

/* ===== 流程圖（泳道） ===== */
.flow-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 16px 16px; }
/* 欄寬至少 112px（1366 寬的筆電放得下）：視窗更窄時整張圖在框裡左右捲動，不要把格子擠扁（字會斷得亂七八糟） */
.flow { position: relative; display: grid; grid-template-columns: 120px repeat(8, minmax(112px, 1fr)); min-width: 1040px; padding: 16px 14px 22px; }
.flow.plan { grid-template-columns: 120px repeat(7, minmax(112px, 1fr)); min-width: 920px; }
.flow .col-line { grid-row: 1 / -1; border-left: 1px dashed var(--line-strong); justify-self: start; width: 0; margin-left: -6px; opacity: .7; }
.flow .head { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 18px; z-index: 1; }
.flow .num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--panel); font-weight: 600; font-size: 12px; font-family: var(--mono); }
.flow .head b { font-size: 13px; font-weight: 600; }
.flow .head small { color: var(--faint); font-size: 11px; font-family: var(--mono); }
.lane-label { display: flex; align-items: center; z-index: 1; padding-right: 10px; }
.pill { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; height: 36px; padding: 0 12px; border-radius: var(--r); font-weight: 600; font-size: 13px; color: #fff; background: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; border: 0; }
.pill.brand { background: var(--accent); color: var(--accent-ink); }
.pill.tech { background: var(--violet); color: var(--panel); }
.pill.change.is-tech { border-left: 3px solid var(--violet); }
.node.tech { background: color-mix(in srgb, var(--violet-soft) 70%, var(--panel)); border-color: color-mix(in srgb, var(--violet) 35%, var(--line)); }
.node.tech .ico { color: var(--violet); }
.pill.change { background: var(--panel); color: var(--ink); border: 1px solid var(--line); height: auto; min-height: 40px; padding: 6px 12px; white-space: normal; flex-direction: column; align-items: flex-start; gap: 2px; cursor: pointer; text-align: left; }
.pill.change:hover { border-color: var(--line-strong); }
.pill.change small { color: var(--faint); font-family: var(--mono); font-size: 10.5px; font-weight: 400; }
.pill.change > span { text-wrap: balance; line-height: 1.35; }
